
reviews:
  enabled: true

  auto_review:
    enabled: true
    drafts: false

  # Target your workflow branches
  base_branches:
    - develop
    - main

  request_changes_workflow: true
  review_status: true
  high_level_summary: true

  # Focus on Flutter/Dart code only
  path_filters:
    include:
      - lib/**
      - test/**
      - pubspec.yaml
    exclude:
      - build/**
      - .dart_tool/**
      - ios/**
      - android/**

ignore:
  paths:
    - build/**
    - .dart_tool/**
    - ios/Pods/**
    - android/.gradle/**
    - .git/**