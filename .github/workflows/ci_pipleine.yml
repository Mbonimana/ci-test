name: Street Team CI/CD

on:
  pull_request:
  branches:
    - develop
    - main

 env:
 ENV: ${{ secrets.ENV }}

 jobs:

 test:
 name: Run Flutter Tests
 runs-on: ubuntu-latest

 steps:
   - uses: actions/checkout@v3

   - uses: subosito/flutter-action@v2
     with:
      flutter-version: '3.41.9'

   - name: Install dependencies
     run: flutter pub get

  # - name: Run tests
  #   run: flutter test

 build-android:
 name: Build ARM64 APK
 runs-on: ubuntu-latest
 needs: test


 steps:
   - uses: actions/checkout@v3

   - uses: subosito/flutter-action@v2
     with:
       flutter-version: '3.41.9'

   - name: Install dependencies
     run: flutter pub get

   - name: Build APKs by ABI
     run: |
       flutter build apk --release --split-per-abi \
         --dart-define=ENV=${{ secrets.ENV }} \
         --dart-define=APP_NAME=${{ secrets.APP_NAME }} \
         --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }} \
         --dart-define=MAP_BOX_ACCESS_TOKEN=${{ secrets.MAP_BOX_ACCESS_TOKEN }} \
         --dart-define=BASE_URL=${{ secrets.BASE_URL }} \
         --dart-define=MURUGO_BASE_URL=${{ secrets.MURUGO_BASE_URL }} \
         --dart-define=APP_KEY=${{ secrets.APP_KEY }} \
         --dart-define=MURUGO_CLIENT_ID=${{ secrets.MURUGO_CLIENT_ID }} \
         --dart-define=MURUGO_CLIENT_SECRET=${{ secrets.MURUGO_CLIENT_SECRET }} \
         --dart-define=STREET_TEAM_CLIENT_ID=${{ secrets.STREET_TEAM_CLIENT_ID }} \
         --dart-define=STREET_TEAM_CLIENT_SECRET=${{ secrets.STREET_TEAM_CLIENT_SECRET }} \
         --dart-define=SUBMITTER_SERVER=${{ secrets.SUBMITTER_SERVER }} \
         --dart-define=PUBLIC_KEY=${{ secrets.PUBLIC_KEY }}

   - name: Verify generated APKs
     run: find build/app/outputs/flutter-apk -name "*.apk"

   - name: Upload ARM64 APK artifact
     uses: actions/upload-artifact@v4
     with:
       name: app-arm64-v8a-${{ secrets.ENV }}
       path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
