name: street_team
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  geolocator: ^14.0.2
  go_router: ^17.2.3
  google_fonts: ^8.1.0
  latlong2: ^0.10.1
  lottie: ^3.3.3
  mapbox_maps_flutter: ^2.23.0
  sentry_flutter: ^9.19.0
  talker_flutter: ^5.1.16
  url_launcher: ^6.3.2
  vector_graphics: ^1.2.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:

  uses-material-design: true

  assets:
  - assets/animation/loading_animation.json

  - assets/icons/

  - assets/murugo/murugo_cloud_label.webp
  - assets/murugo/murugo_clouds.webp
  - assets/murugo/murugo_sun.svg
  # MOCK DATA
  - assets/mock/organization_examples.json
  - assets/mock/location_examples.json

  - assets/mock/organization_types.json
  - assets/mock/organization_subtypes.json
  - assets/mock/location_types.json
  #New Data Files
  - assets/organization_options.json
  - assets/organization_types.json
  - assets/location_types.json

